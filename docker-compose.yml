# Cap container log files so a noisy service can't fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stundenplan}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-stundenplan}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - planner

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-stundenplan}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SCANNER_TOKEN: ${SCANNER_TOKEN:?SCANNER_TOKEN must be set in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      AUTO_START_SCANNER_ON_EMPTY_DB: ${AUTO_START_SCANNER_ON_EMPTY_DB:-false}
      TUCAN_BASE_URL: ${TUCAN_BASE_URL:-https://www.tucan.tu-darmstadt.de}
      TUCAN_START_URL: ${TUCAN_START_URL:-https://www.tucan.tu-darmstadt.de/scripts/mgrqispi.dll?APPNAME=CampusNet&PRGNAME=EXTERNALPAGES&ARGUMENTS=-N000000000000001,-N000344,-Awelcome}
      TUCAN_RATE_LIMIT_MS: ${TUCAN_RATE_LIMIT_MS:-750}
      TUCAN_FACULTY_PREFIX: ${TUCAN_FACULTY_PREFIX:-FB20 - Informatik}
      SCAN_BATCH_SIZE: ${SCAN_BATCH_SIZE:-10}
      MODULE_HANDBOOK_OVERVIEW_URL: ${MODULE_HANDBOOK_OVERVIEW_URL:-https://www.informatik.tu-darmstadt.de/studium_fb20/im_studium/formulare_und_dokumente/ordnungen/index.de.jsp}
      EXAM_PLAN_OVERVIEW_URL: ${EXAM_PLAN_OVERVIEW_URL:-https://www.intern.tu-darmstadt.de/verwaltung/dez_ii/campusmanagement/cm_lvm/pruefungstermine_zentral/index.de.jsp}
      PORT: 4000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - planner

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - planner

  scanner:
    build:
      context: .
      dockerfile: scanner/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      BACKEND_API_URL: http://backend:4000/api
      SCANNER_TOKEN: ${SCANNER_TOKEN:?SCANNER_TOKEN must be set in .env}
      TUCAN_BASE_URL: ${TUCAN_BASE_URL:-https://www.tucan.tu-darmstadt.de}
      TUCAN_START_URL: ${TUCAN_START_URL:-https://www.tucan.tu-darmstadt.de/scripts/mgrqispi.dll?APPNAME=CampusNet&PRGNAME=EXTERNALPAGES&ARGUMENTS=-N000000000000001,-N000344,-Awelcome}
      TUCAN_RATE_LIMIT_MS: ${TUCAN_RATE_LIMIT_MS:-750}
      SCAN_INTERVAL_HOURS: ${SCAN_INTERVAL_HOURS:-24}
      TUCAN_FACULTY_PREFIX: ${TUCAN_FACULTY_PREFIX:-FB20 - Informatik}
      SCAN_BATCH_SIZE: ${SCAN_BATCH_SIZE:-10}
      MODULE_HANDBOOK_OVERVIEW_URL: ${MODULE_HANDBOOK_OVERVIEW_URL:-https://www.informatik.tu-darmstadt.de/studium_fb20/im_studium/formulare_und_dokumente/ordnungen/index.de.jsp}
      EXAM_PLAN_OVERVIEW_URL: ${EXAM_PLAN_OVERVIEW_URL:-https://www.intern.tu-darmstadt.de/verwaltung/dez_ii/campusmanagement/cm_lvm/pruefungstermine_zentral/index.de.jsp}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - planner

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token=${CF_TUNNEL_TOKEN:-}
    restart: unless-stopped
    logging: *default-logging
    environment:
      CF_TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    networks:
      - planner

volumes:
  pgdata:

networks:
  planner:
