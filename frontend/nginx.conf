# Cloudflare enforces HTTPS, adds HSTS, and supplies the visitor's scheme.
# Production nginx is private to the tunnel; local requests have no header.
map $http_x_forwarded_proto $visitor_scheme {
    default $scheme;
    http http;
    https https;
}

server {
    listen 3000;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (apply to the app shell and proxied API responses; the
    # immutable /assets/ block below overrides add_header per nginx inheritance,
    # which is fine for static hashed subresources). 'unsafe-inline' is required
    # for style-src because the React UI uses inline style props; scripts are
    # all bundled to same-origin files so script-src stays strict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API requests are proxied to the backend. Resolve via Docker's internal DNS
    # at request time so backend restarts don't require an nginx reload.
    location = /api {
        return 308 /api/$is_args$args;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://backend:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $visitor_scheme;
    }

    # Hashed build assets are immutable and safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
